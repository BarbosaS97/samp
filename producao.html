<style>
  .pr-bar { position: sticky; top: 56px; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 16px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }

  .pr-info { display: none; background: #fbf7ec; border: 1px solid #e7d9b3; border-left: 3px solid var(--gold); border-radius: var(--radius); padding: 12px 16px; font-size: .84rem; color: #5b4a1c; margin: -6px 0 18px; line-height: 1.5; }

  .pr-fresco { display: flex; gap: 22px; align-items: stretch; }

  .pr-fresco b { font-size: 1.15rem; color: var(--navy); font-weight: 600; margin-top: 2px; }
  .pr-modo { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .pr-modo button { border: 0; background: #fff; padding: 9px 18px; font-size: .84rem; font-weight: 600; color: var(--muted); cursor: pointer; }
  .pr-modo button + button { border-left: 1px solid var(--line); }
  .pr-modo button.on { background: var(--navy); color: #fff; }
  .pr-vazio { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 40px 24px; text-align: center; color: var(--muted); }
  .pr-vazio h2 { color: var(--navy); font-size: 1.1rem; margin-bottom: 6px; }
  .pr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .pr-box { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
  .pr-box h3 { font-size: .95rem; color: var(--navy); font-weight: 600; margin-bottom: 2px; }
  .pr-box .sub { font-size: .78rem; color: var(--muted); margin-bottom: 10px; }
  .pr-box.larga { grid-column: 1 / -1; }
  .pr-box canvas { max-width: 100%; }
  .pr-ch { position: relative; height: 290px; }
  .pr-ch.alto { height: 380px; }
  .pr-tab { overflow: auto; max-height: 520px; border: 1px solid var(--line); border-radius: var(--radius); }
  .pr-tab table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  .pr-tab th, .pr-tab td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); text-align: right; white-space: nowrap; }
  .pr-tab th:first-child, .pr-tab td:first-child { text-align: left; }
  .pr-tab thead th { position: sticky; top: 0; background: var(--navy); color: #fff; font-weight: 600; font-size: .75rem; z-index: 1; cursor: default; }
  .pr-tab thead th.ord { cursor: pointer; }
  .pr-tab tbody tr.cl { cursor: pointer; }
  .pr-tab tbody tr.cl:hover td { background: var(--navy-soft); }
  .pr-tab td.zero { color: #b3bcc8; }
  .pr-tab tfoot td { font-weight: 700; background: var(--navy-soft); position: sticky; bottom: 0; }
  .pr-var.up { color: var(--ok); } .pr-var.down { color: var(--bad); }
  .pr-heat table { table-layout: fixed; }
  .pr-heat th, .pr-heat td { text-align: center; padding: 9px 4px; border-right: 1px solid #fff; }
  .pr-heat th:first-child, .pr-heat td:first-child { text-align: left; width: 64px; padding-left: 14px; }
  .pr-heat th:last-child, .pr-heat td:last-child { width: 82px; text-align: center; border-right: 0; }
  .pr-heat td.h { font-variant-numeric: tabular-nums; }
  /* a linha toda não muda ao passar o mouse: só o bloco sob o cursor clareia */
  .pr-heat tbody tr td:not(.h) { background: #fff !important; }
  .pr-heat tbody td.h { background: var(--bg, #f8f9fb) !important; color: var(--fg, var(--ink)); transition: background .12s, color .12s; }
  .pr-heat tbody td.h:not(.zero):hover { background: #eef3f8 !important; color: var(--navy); font-weight: 700; box-shadow: inset 0 0 0 2px var(--navy); }
  .pr-k .kpis { display: none; }
  .pk-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
  .pk { background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--navy); border-radius: var(--radius); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; position: relative; overflow: hidden; transition: box-shadow .2s, transform .2s; animation: th-sobe .5s both; }
  .pk:hover { box-shadow: 0 6px 18px rgba(12,37,64,.1); transform: translateY(-2px); }
  .pk.gold { border-top-color: var(--gold); }
  .pk-l { font-size: .7rem; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 700; }
  .pk-v, .pk-t { font-size: 1.9rem; font-weight: 600; color: var(--navy); line-height: 1.12; font-variant-numeric: tabular-nums; }
  .pk-v small, .pk-t small { font-size: .95rem; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .pk-s { font-size: .8rem; color: var(--ink); line-height: 1.35; }
  .pk-s small { color: var(--muted); font-size: .74rem; }
  .pk-badge { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; width: fit-content; margin-top: 3px; }
  .pk-badge.up { background: #e3f2ea; color: var(--ok); } .pk-badge.down { background: #fbe9e7; color: var(--bad); } .pk-badge.eq { background: #eef1f5; color: var(--muted); }
  .pk-spark { width: 100%; height: 34px; margin-top: 6px; display: block; }
  .pk-spark .ar { fill: rgba(18,53,91,.09); stroke: none; }
  .pk-spark .ln { fill: none; stroke: var(--navy); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .pk-spark .dot { fill: none; stroke: var(--gold); stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .pk-comp { display: flex; height: 9px; border-radius: 5px; overflow: hidden; background: #e8edf3; margin: 8px 0 6px; gap: 2px; }
  .pk-comp i { display: block; height: 100%; transition: width .6s cubic-bezier(.4,0,.2,1); }
  .pk-leg { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: .72rem; color: var(--muted); }
  .pk-leg span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--c); vertical-align: baseline; }
  .pk-leg b { color: var(--ink); font-weight: 600; }
  .pk-grid.tres { grid-template-columns: repeat(3, 1fr); }
  .pk-nota { font-size: .72rem; color: var(--muted); line-height: 1.35; }
  .pr-chk { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; color: var(--ink); cursor: pointer; }
  .pr-chk input { accent-color: var(--navy); width: 15px; height: 15px; }
  .pr-heat td.h .dot { position: absolute; top: 3px; right: 4px; width: var(--d, 10px); height: var(--d, 10px); border-radius: 50%; background: var(--g, var(--gold)); box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 1px 3px rgba(12,37,64,.35); cursor: help; transition: transform .15s ease; outline: none; }
  .pr-heat td.h .dot::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; }   /* área de toque maior que o desenho */
  .pr-heat td.h .dot:hover, .pr-heat td.h .dot:focus-visible { transform: scale(1.35); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--navy); }
  .pr-tip { position: fixed; z-index: 2000; width: 300px; max-width: calc(100vw - 20px); background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px rgba(12,37,64,.22); padding: 12px 14px 12px; font-size: .8rem; color: var(--ink); line-height: 1.4; opacity: 0; transform: translateY(4px); transition: opacity .12s ease, transform .12s ease; pointer-events: none; }
  .pr-tip.on { opacity: 1; transform: none; }
  .pr-tip .t-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line-soft); padding-bottom: 7px; margin-bottom: 8px; }
  .pr-tip .t-h b { font-size: .95rem; color: var(--navy); font-weight: 600; }
  .pr-tip .t-h span { color: var(--muted); font-size: .76rem; white-space: nowrap; }
  .pr-tip .t-sec { margin-top: 9px; }
  .pr-tip .t-sec > small { display: block; font-size: .66rem; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .pr-tip .t-barra { height: 8px; border-radius: 4px; background: #e8edf3; overflow: hidden; display: flex; gap: 1px; margin: 5px 0 3px; }
  .pr-tip .t-barra i { display: block; height: 100%; }
  .pr-tip .t-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .pr-tip .t-chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 10px; font-size: .74rem; font-weight: 600; background: color-mix(in srgb, var(--c) 12%, #fff); color: color-mix(in srgb, var(--c) 82%, #000); border: 1px solid color-mix(in srgb, var(--c) 30%, #fff); }
  .pr-tip .t-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .pr-tip .t-lin { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dashed var(--line-soft); }
  .pr-tip .t-lin:last-child { border-bottom: 0; }
  .pr-tip .t-lin span { color: var(--muted); font-size: .76rem; text-align: right; }
  .pr-tip .t-obs { font-size: .76rem; color: var(--muted); font-style: italic; margin-top: 3px; }
  .pr-tip .t-rod { margin-top: 10px; padding: 7px 9px; border-radius: 6px; background: var(--navy-soft); color: var(--navy); font-size: .78rem; }
  .pr-tip .t-rod b { font-size: .95rem; }
  .pr-tip .t-nada { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .pr-tip, .pr-heat td.h .dot { transition: none; } }
  .pr-heat td.h { position: relative; }
  .pr-leg-aus { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .74rem; color: var(--muted); margin: 8px 0 0; }
  .pr-leg-aus span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; }
  .pr-obs { font-size: .78rem; color: var(--ink); white-space: normal !important; min-width: 220px; text-align: left !important; line-height: 1.4; }
  .pr-obs i { font-style: normal; display: inline-block; padding: 1px 7px; margin: 1px 4px 1px 0; border-radius: 9px; background: color-mix(in srgb, var(--c) 14%, #fff); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 35%, #fff); font-size: .72rem; font-weight: 600; }
  .pr-tab td.mut { color: #9aa6b4; }
  @media (max-width: 1000px) { .pk-grid { grid-template-columns: repeat(2, 1fr); } .pr-fresco { display: none; } }
  @media (max-width: 560px) { .pk-grid, .pk-grid.tres { grid-template-columns: 1fr; } .pr-bar select { min-width: 0; } .pr-bar .pr-info-btn { margin-left: 0; } }
  @media (max-width: 560px) { .pr-grid { grid-template-columns: 1fr; } .pr-ch { height: 250px; } }
</style>

<body data-page="producao">
<script src="layout.js?v=20261005a"></script>
<main class="page">
  <div class="header mt-cab">
    <div class="mt-cab-txt">
      <h1>Produção Individual</h1>
      <p>Processos calculados por pessoa e pelo setor, a partir das planilhas de produção</p>
      <div class="meta" id="meta"></div>
    </div>
    <div class="pr-fresco" id="fresco"></div>
  </div>

  <div id="conteudo"><div class="pr-vazio">Carregando a produção...</div></div>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const MES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  const DIAS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  const NAVY = '#12355b', GOLD = '#a68a4e', CINZA = '#9fb0c3', OK = '#2f7d5b';
  // cada ano tem sempre a mesma cor, em todos os gráficos
  const CORES_ANO = ['#8a97a6', '#3b9ac4', '#2f9e6e', '#8e5fc0', '#e08a2c', '#cf3b5a', GOLD, NAVY];
  const corDe = (a) => { const i = a - 2019; return i >= 0 && i < CORES_ANO.length ? CORES_ANO[i] : CORES_ANO[Math.abs(i) % CORES_ANO.length]; };
  const COR_TIPO = [NAVY, GOLD, '#b8c2cf'];   // meta, acervo, não classificado
  const NOME_TIPO = ['Meta', 'Acervo', 'Sem classificação'];
  const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const n0 = (x) => Math.round(x).toLocaleString('pt-BR');
  const n1 = (x) => x.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const pct = (x) => (x > 0 ? '+' : '') + x.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';

  let pessoas = [];          // [{ nome, m, g, gn, d, r, total, primeira, ultima }]
  let modo = 'setor', pessoaSel = '', anoSel = '';
  let acesso = { todas: false, pessoas: [] };   // produções individuais que esta matrícula pode abrir em detalhe
  const pode = (nome) => acesso.todas || acesso.pessoas.includes(nome);
  const SEM_ACESSO = 'Você não tem acesso à produção individual desta pessoa. Peça a liberação ao responsável pelo Cadastros.';
  let graficos = [];
  let ordem = { col: 'total', asc: false };

  /* ---------- carga ---------- */
  async function carregar() {
    const c = window.criarClienteLeitura();
    const r = await c.from('producao_resumo').select('*').order('pessoa');
    if (r.error) return erro('Não foi possível carregar a produção (' + r.error.message + '). Verifique se o SQL 11 foi executado e a função publicada.');
    pessoas = (r.data || []).map((x) => ({ nome: x.pessoa, total: x.total, primeira: x.primeira_data, ultima: x.ultima_data, atualizado: x.atualizado_em, ...x.dados }));
    if (!pessoas.length) return $('conteudo').innerHTML = '<div class="pr-vazio"><h2>Nenhuma produção importada ainda</h2><p>Em Cadastros, aba Produção Individual, envie as planilhas "PRODUÇÃO SECAJ - Nome".</p></div>';
    // calendário de ausências (opcional: se não existir, a página funciona como antes)
    try {
      const cr = await c.from('producao_calendario').select('pessoa,dados,atualizado_em');
      if (!cr.error) for (const x of cr.data || []) { const m = x.dados && x.dados.m; if (m) cal.set(x.pessoa, m); }
    } catch (e) { /* sem calendário */ }
    // o Setor é de todos; o detalhe Individual só das pessoas liberadas a esta matrícula em Cadastros (sem resposta = nenhuma)
    try {
      const s = window.SAMP_AUTH.get();
      const a = await window.chamarSAMP({ action: 'producao_acesso', token: s && s.token });
      acesso = { todas: !!a.todas, pessoas: Array.isArray(a.pessoas) ? a.pessoas : [] };
    } catch (e) { if (e.status === 401) window.SAMP_AUTH.sair(); }
    pessoaSel = (pessoas.find((p) => pode(p.nome)) || {}).nome || '';
    montarEstrutura(); desenhar();
  }
  const erro = (t) => { $('conteudo').innerHTML = '<div class="pr-vazio"><h2>Produção indisponível</h2><p>' + esc(t) + '</p></div>'; };

  /* ---------- agregações ---------- */
  const anosDe = (lista) => [...new Set(lista.flatMap((p) => p.m.map((x) => x[0])))].sort();
  const filtraAno = (m) => (anoSel ? m.filter((x) => String(x[0]) === anoSel) : m);
  const ym = (a, m) => a * 12 + (m - 1);
  const rotYM = (v) => MES[v % 12] + '/' + Math.floor(v / 12);
  function serieMensal(lista, comAno) {   // { ym -> [meta, acervo, semClass] }
    const s = new Map();
    for (const p of lista) for (const x of (comAno ? filtraAno(p.m) : p.m)) {
      const k = ym(x[0], x[1]); const a = s.get(k) || [0, 0, 0]; a[x[2]] += x[5]; s.set(k, a);
    }
    return s;
  }
  function resumo(lista) {
    const ms = lista.flatMap((p) => filtraAno(p.m));
    const o = { total: 0, meta: 0, acervo: 0, nc: 0, prio: 0, prio60: 0, legal: 0, he: 0, soma: 0, nd: 0 };
    for (const x of ms) {
      o.total += x[5]; if (x[2] === 0) o.meta += x[5]; else if (x[2] === 1) o.acervo += x[5]; else o.nc += x[5];
      if (x[3] === 1) o.prio += x[5]; if (x[3] === 2) o.prio60 += x[5]; if (x[3] === 3) o.legal += x[5];
      if (x[4]) o.he += x[5]; o.soma += x[6]; o.nd += x[7];
    }
    const s = serieMensal(lista, true);
    o.meses = s.size; o.media = s.size ? o.total / s.size : 0;
    let melhor = null; for (const [k, v] of s) { const t = v[0] + v[1] + v[2]; if (!melhor || t > melhor.t) melhor = { k, t }; }
    o.melhor = melhor; o.tempo = o.nd ? o.soma / o.nd : null;
    return o;
  }
  function porGrupo(lista) {
    const t = new Map();
    for (const p of lista) for (const x of p.g) { if (anoSel && String(x[0]) !== anoSel) continue; const nome = p.gn[x[1]]; t.set(nome, (t.get(nome) || 0) + x[2]); }
    return [...t].sort((a, b) => b[1] - a[1]);
  }
  function porDiaSemana(lista) {
    const v = [0, 0, 0, 0, 0, 0, 0], dias = [new Set(), new Set(), new Set(), new Set(), new Set(), new Set(), new Set()];
    for (const p of lista) for (const [d, q] of p.d) {
      if (anoSel && d.slice(0, 4) !== anoSel) continue;
      const w = (new Date(d + 'T12:00:00Z').getUTCDay() + 6) % 7; v[w] += q; dias[w].add(p.nome + d);
    }
    return v.map((q, i) => ({ q, dias: dias[i].size }));
  }
  const ultimoMes = (lista) => lista.reduce((a, p) => (p.ultima && (!a || p.ultima > a) ? p.ultima : a), '');


  /* ---------- calendário de ausências ---------- */
  let cal = new Map(), contaTrein = false, calIdx = new Map();
  const CAT_NOME = { f: 'Férias', l: 'Licença', t: 'Treinamento/licença', x: 'Falta', r: 'Recesso/eleitoral' };
  const CAT_COR = { f: '#3b9ac4', l: '#cf3b5a', t: '#8e5fc0', x: '#374151', r: '#e08a2c' };
  const ausDe = (it) => it.f + it.l + it.x + it.r + (contaTrein ? it.t : 0);   // treinamento só é descontado se o usuário marcar
  const dispDe = (it) => Math.max(0, it.u - ausDe(it));
  const marcDe = (it) => it.f + it.l + it.t + it.x + it.r;
  const ddmm = (iso) => iso.slice(8) + '/' + iso.slice(5, 7);
  function prodPorMes(p) {
    if (!p._pm) { p._pm = new Map(); for (const x of p.m) { const k = ym(x[0], x[1]); p._pm.set(k, (p._pm.get(k) || 0) + x[5]); } }
    return p._pm;
  }
  const faixaPessoa = (p) => [ym(+p.primeira.slice(0, 4), +p.primeira.slice(5, 7)), ym(+p.ultima.slice(0, 4), +p.ultima.slice(5, 7))];

    const part = (c) => ({ rot: CAT_NOME[c], v: a[c], cor: CAT_COR[c] });
    return '<div class="pk-grid tres">' +
      `<div class="pk gold" style="animation-delay:.38s"><span class="pk-l">Produção por dia disponível</span><span class="pk-t">${pDisp === null ? '-' : n1(pDisp)} <small>por dia</small></span>` +
        `<span class="pk-s">${pUtil === null ? '' : n1(pUtil) + ' por dia útil, sem descontar ausências'}</span>${pDisp !== null && Math.abs(ajuste) > 0.5 ? badge(ajuste, pct(ajuste) + ' ao descontar as ausências') : ''}</div>` +
      `<div class="pk" style="animation-delay:.42s"><span class="pk-l">Dias úteis de ausência</span><span class="pk-v">${n0(a.marc)}</span><span class="pk-s">${a.u ? (a.marc / a.u * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '% dos dias úteis' : ''}</span>` +
        comp(['f', 'l', 't', 'x', 'r'].map(part)) + (contaTrein ? '' : '<span class="pk-nota">Treinamento/licença aparece à parte e não é descontado dos dias disponíveis.</span>') + '</div>' +
      `<div class="pk" style="animation-delay:.46s"><span class="pk-l">Dias úteis disponíveis</span><span class="pk-v">${n0(a.disp)}</span><span class="pk-s">de ${n0(a.u)} dias úteis (${a.u ? Math.round(a.disp / a.u * 100) : 0}%)</span>` +
        `<span class="pk-nota">Calendário cobre ${a.meses} ${a.meses === 1 ? 'mês' : 'meses'} no período.</span></div>` +
      '</div>';
  }

  /* ---------- tabelas ---------- */
  function linhaPessoa(p) {
    const r = resumo([p]);
    const s = serieMensal([p], false), ks = [...s.keys()].sort((a, b) => a - b);
    const fimGeral = ym(+ultimoMes(pessoas).slice(0, 4), +ultimoMes(pessoas).slice(5, 7));
    const ultK = fimGeral;   // último mês fechado do setor: quem não produziu nele aparece com zero
    const tot = (k) => { const a = s.get(k); return a ? a[0] + a[1] + a[2] : 0; };
    const u = tot(ultK);
    const vs = r.media > 0 ? ((u - r.media) / r.media) * 100 : null;
    const classif = r.meta + r.acervo;
    const ac = cal.has(p.nome) ? aggCal(indiceCal([p])) : null;   // ausências e produção por dia disponível (se houver calendário)
    return { nome: p.nome, total: r.total, media: r.media, meses: r.meses, ultimo: u, vs, metaPct: classif ? (r.meta / classif) * 100 : null, prio: r.prio + r.prio60 + r.legal, tempo: r.tempo, primeira: p.primeira, ultimaData: p.ultima, fim: ultK,
      aus: ac && ac.meses ? ac.marc : null, pdia: ac && ac.disp > 0 ? ac.prod / ac.disp : null };
  }
  function tabelaRanking() {
    const ls = pessoas.map(linhaPessoa).filter((x) => x.total > 0);
    const cmp = (a, b) => { const x = a[ordem.col], y = b[ordem.col]; const nx = x == null ? -Infinity : x, ny = y == null ? -Infinity : y; return (typeof nx === 'string' ? nx.localeCompare(ny) : nx - ny) * (ordem.asc ? 1 : -1); };
    ls.sort(cmp);
    const soma = ls.reduce((a, x) => a + x.total, 0);
    const th = (col, txt) => `<th class="ord" data-c="${col}">${txt}${ordem.col === col ? (ordem.asc ? ' ▲' : ' ▼') : ''}</th>`;
    const fim = ls.length ? ls[0].fim : 0;
    return '<div class="pr-tab"><table><thead><tr>' + th('nome', 'Pessoa') + th('total', 'Processos') + th('media', 'Média/mês') + th('ultimo', fim ? 'Último mês (' + rotYM(fim) + ')' : 'Último mês') + th('vs', 'vs. própria média') + th('metaPct', '% meta') + th('prio', 'Prioritários') + th('tempo', 'Tempo médio (dias)') + (cal.size ? th('aus', 'Dias de ausência') + th('pdia', 'Por dia disponível') : '') + '<th>Período</th></tr></thead><tbody>' +
      ls.map((x) => `<tr${pode(x.nome) ? ` class="cl" data-p="${esc(x.nome)}"` : ' title="Sem acesso ao detalhe individual desta pessoa"'}><td><b>${esc(x.nome)}</b></td><td>${n0(x.total)}</td><td>${n1(x.media)}</td><td${x.ultimo ? '' : ' class="zero"'}>${n0(x.ultimo)}</td>` +
        `<td>${x.vs === null ? '-' : `<span class="pr-var ${x.vs >= 0 ? 'up' : 'down'}">${pct(x.vs)}</span>`}</td><td>${x.metaPct === null ? '-' : Math.round(x.metaPct) + '%'}</td><td>${n0(x.prio)}</td><td>${x.tempo === null ? '-' : n0(x.tempo)}</td>` +
        (cal.size ? `<td${x.aus ? '' : ' class="mut"'}>${x.aus === null ? '-' : n0(x.aus)}</td><td>${x.pdia === null ? '-' : n1(x.pdia)}</td>` : '') +
        `<td>${x.primeira ? MES[+x.primeira.slice(5, 7) - 1] + '/' + x.primeira.slice(0, 4) : '-'} a ${x.ultimaData ? MES[+x.ultimaData.slice(5, 7) - 1] + '/' + x.ultimaData.slice(0, 4) : '-'}</td></tr>`).join('') +
      `</tbody><tfoot><tr><td>Total do setor</td><td>${n0(soma)}</td><td colspan="${cal.size ? 9 : 7}"></td></tr></tfoot></table></div>`;
  }
  function quadroMensal(lista) {   // o mesmo quadro Jan-Dez x ano das planilhas, com mapa de calor e marcas de ausência
    const t = new Map(); for (const p of lista) for (const x of p.m) { const k = x[0] + '|' + x[1]; t.set(k, (t.get(k) || 0) + x[5]); }
    const anos = anosDe(lista); let mx = 0; t.forEach((v) => { if (v > mx) mx = v; });
    const indiv = lista.length === 1;
    // ponto = mês com ausências; as cores mostram a composição (tipo e proporção) e o tamanho, o peso no mês
    const conic = (o) => {
      const cs = ['f', 'l', 't', 'x', 'r'].filter((c) => o[c] > 0); let acc = 0;
      return 'conic-gradient(' + cs.map((c) => { const ini = acc; acc += (o[c] / o.marc) * 100; return `${CAT_COR[c]} ${ini.toFixed(1)}% ${acc.toFixed(1)}%`; }).join(', ') + ')';
    };
    const cel = (v, a, m) => {
      const k = ym(a, m), o = calIdx.get(k), marcado = o && (indiv ? o.marc > 0 : o.marc / Math.max(1, o.u) >= 0.1);
      if (!v && !marcado) return '<td class="h zero">-</td>';
      const peso = marcado ? Math.min(1, o.marc / Math.max(1, o.u) / (indiv ? 0.6 : 0.3)) : 0;
      const dot = marcado ? `<b class="dot" tabindex="0" role="button" aria-label="Ver as ausências de ${rotLongo(k)}" style="--d:${(9 + 5 * peso).toFixed(1)}px;--g:${conic(o)}"></b>` : '';
      return `<td class="h${marcado ? ' aus' : ''}${v ? '' : ' zero'}" data-k="${k}" data-v="${v}" style="${v ? `--bg:rgba(18,53,91,${(0.08 + 0.55 * (v / mx)).toFixed(2)});--fg:${v / mx > .55 ? '#fff' : 'var(--ink)'}` : ''}">${v ? n0(v) : '-'}${dot}</td>`;
    };
    const leg = calIdx.size ? '<div class="pr-leg-aus">' + ['f', 'l', 't', 'x', 'r'].map((c) => `<span style="--c:${CAT_COR[c]}">${CAT_NOME[c]}</span>`).join('') +
      `<span style="--c:#9aa6b4">${indiv ? 'O ponto marca meses com ausências' : 'O ponto marca meses em que 10% ou mais dos dias úteis do setor foram de ausência'}; as cores mostram o tipo. Passe o mouse (ou toque) no ponto para ver os detalhes.</span></div>` : '';
    return '<div class="pr-tab pr-heat" data-indiv="' + (indiv ? 1 : 0) + '"><table><thead><tr><th>Ano</th>' + MES.map((m) => `<th>${m}</th>`).join('') + '<th>Total</th></tr></thead><tbody>' +
      anos.map((a) => { let s = 0; const cs = MES.map((_, i) => { const v = t.get(a + '|' + (i + 1)) || 0; s += v; return cel(v, a, i + 1); }).join(''); return `<tr><td><b>${a}</b></td>${cs}<td><b>${n0(s)}</b></td></tr>`; }).join('') + '</tbody></table></div>' + leg;
  }
  // tabela de ausências: individual (mês a mês, com períodos e observações) ou do setor (capacidade por mês)
  function tabelaAusencias(lista) {
    const meses = [...calIdx.values()].filter((o) => doAno(o.k) && (lista.length === 1 ? o.marc > 0 || o.notas.length : o.marc > 0)).sort((a, b) => b.k - a.k);
    if (!meses.length) return '<div class="sub" style="margin:0">Nenhuma ausência registrada no calendário para este período.</div>';
    const indiv = lista.length === 1;
    if (indiv) {
      return '<div class="pr-tab"><table><thead><tr><th>Mês</th><th>Dias úteis</th><th>Disponíveis</th><th>Férias</th><th>Licença</th><th>Trein./lic.</th><th>Falta</th><th>Recesso</th><th>Processos</th><th>Por dia disp.</th><th>Períodos e observações</th></tr></thead><tbody>' +
        meses.map((o) => `<tr><td><b>${rotYM(o.k)}</b></td><td>${o.u}</td><td>${o.disp}</td>` + ['f', 'l', 't', 'x', 'r'].map((c) => `<td${o[c] ? '' : ' class="mut"'}>${o[c] || '-'}</td>`).join('') +
          `<td>${n0(o.prod)}</td><td>${o.disp > 0 && o.prod ? n1(o.prod / o.disp) : '-'}</td><td class="pr-obs">${textoObsMes(o) || '-'}</td></tr>`).join('') + '</tbody></table></div>';
    }
    return '<div class="pr-tab"><table><thead><tr><th>Mês</th><th>Pessoas com ausência</th><th>Dias úteis de ausência</th><th>% da capacidade</th><th>Processos</th><th>Por dia disponível</th><th>Quem mais se ausentou</th></tr></thead><tbody>' +
      meses.slice(0, 36).map((o) => {
        const por = new Map(); for (const q of o.per) por.set(q.p, (por.get(q.p) || 0) + q.u);
        const topo = [...por].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([p, d]) => `${esc(p)} (${d} d)`).join(', ');
        return `<tr><td><b>${rotYM(o.k)}</b></td><td>${o.nAus} de ${o.nPes}</td><td>${o.marc}</td><td>${(o.marc / Math.max(1, o.u) * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%</td><td>${n0(o.prod)}</td><td>${o.disp > 0 && o.prod ? n1(o.prod / o.disp) : '-'}</td><td class="pr-obs">${topo || '-'}</td></tr>`;
      }).join('') + '</tbody></table></div>';
  }

  /* ---------- desenho ---------- */
  function desenhar() {
    graficos.forEach((g) => g.destroy()); graficos = [];
    const lista = modo === 'setor' ? pessoas : pessoas.filter((p) => p.nome === pessoaSel);
    const fim = ultimoMes(pessoas);
    const ate = fim ? MES[+fim.slice(5, 7) - 1] + '/' + fim.slice(0, 4) : '-';
    const imp = pessoas.reduce((a, p) => (p.atualizado > a ? p.atualizado : a), '');
    const anosHist = anosDe(pessoas);
    $('meta').innerHTML = `<span class="chip"><b>${pessoas.length}</b> pessoas</span>` + (anosHist.length ? `<span class="chip"><b>${anosHist[0]}</b> a <b>${anosHist[anosHist.length - 1]}</b></span>` : '') + `<span class="chip">Só meses fechados</span>`;
    $('fresco').innerHTML = `<div><span>Dados até</span><b>${ate}</b></div><div><span>Última importação</span><b>${imp ? new Date(imp).toLocaleDateString('pt-BR') : '-'}</b></div>`;
    calIdx = indiceCal(lista);
    let h = cartoes(lista);
    if (modo === 'setor') {
      h += '<div class="pr-grid">' +
        '<div class="pr-box larga"><h3>Produção mensal do setor</h3><div class="sub">Processos calculados por mês, separados em meta, acervo e sem classificação</div><div class="pr-ch alto"><canvas id="g1"></canvas></div></div>' +
        '<div class="pr-box"><h3>Produção por ano</h3><div class="sub">Total do setor em cada ano, com as mesmas cores do gráfico ao lado (o último pode estar incompleto)</div><div class="pr-ch"><canvas id="g2"></canvas></div></div>' +
        '<div class="pr-box"><h3>Comparação mês a mês entre os anos</h3><div class="sub">Cada cor é um ano; a linha mais grossa é o ano mais recente</div><div class="pr-ch"><canvas id="g3"></canvas></div></div>' +
        '<div class="pr-box"><h3>Assuntos mais calculados</h3><div class="sub">Assuntos agrupados</div><div class="pr-ch alto"><canvas id="g4"></canvas></div></div>' +
        '<div class="pr-box"><h3>Dia da semana</h3><div class="sub">Média de processos por dia trabalhado</div><div class="pr-ch"><canvas id="g5"></canvas></div></div>' +
        '<div class="pr-box larga"><h3>Quadro mensal do setor</h3><div class="sub">Total de cada mês (quanto mais escuro, maior a produção)</div>' + quadroMensal(pessoas) + '</div>' +
        (calIdx.size ? '<div class="pr-box larga"><h3>Ausências e capacidade do setor</h3><div class="sub">Meses com ausências no calendário (do mais recente para o mais antigo, até 36). Os dias são úteis; "capacidade" é o total de dias úteis das pessoas com calendário.</div>' + tabelaAusencias(lista) + '</div>' : '') +
        '<div class="pr-box larga"><h3>Produção por pessoa</h3><div class="sub">Clique no nome para ver o detalhe individual. Cabeçalhos ordenam a tabela. As médias consideram só os meses em que a pessoa produziu.</div><div id="rank">' + tabelaRanking() + '</div></div>' +
        '</div>';
    } else {
      const p = lista[0];
      h += '<div class="pr-grid">' +
        `<div class="pr-box larga"><h3>Produção mensal de ${esc(p.nome)}</h3><div class="sub">Processos calculados por mês, em meta, acervo e sem classificação</div><div class="pr-ch alto"><canvas id="g1"></canvas></div></div>` +
        '<div class="pr-box"><h3>Comparação mês a mês entre os anos</h3><div class="sub">Cada linha é um ano</div><div class="pr-ch"><canvas id="g3"></canvas></div></div>' +
        '<div class="pr-box"><h3>Produção por ano</h3><div class="sub">Total de cada ano</div><div class="pr-ch"><canvas id="g2"></canvas></div></div>' +
        '<div class="pr-box"><h3>Assuntos mais calculados</h3><div class="sub">Assuntos agrupados</div><div class="pr-ch alto"><canvas id="g4"></canvas></div></div>' +
        '<div class="pr-box"><h3>Dia da semana</h3><div class="sub">Média de processos por dia trabalhado</div><div class="pr-ch"><canvas id="g5"></canvas></div></div>' +
        '<div class="pr-box larga"><h3>Quadro mensal</h3><div class="sub">Mesmo quadro da planilha: processos por mês e ano</div>' + quadroMensal(lista) + '</div>' +
        (calIdx.size ? `<div class="pr-box larga"><h3>Ausências e observações de ${esc(p.nome)}</h3><div class="sub">Meses com férias, licença, treinamento, falta ou recesso no calendário, com os períodos e as observações registradas. Licença médica aparece só como "licença".</div>` + tabelaAusencias(lista) + '</div>' : '') +
        `<div class="pr-box larga"><h3>Observações sobre os dados</h3><div class="sub">Processos refeitos: ${n0(p.r.refeitos)} lançamentos repetidos do mesmo número (${n0(p.r.repetidos)} processos aparecem mais de uma vez). Primeiro lançamento: ${p.primeira ? p.primeira.split('-').reverse().join('/') : '-'}; último: ${p.ultima ? p.ultima.split('-').reverse().join('/') : '-'}. Importado em ${new Date(p.atualizado).toLocaleString('pt-BR')}.</div></div>` +
        '</div>';
    }
    h += '<p class="desc" style="color:var(--muted);font-size:.78rem;margin:0 0 24px">Assuntos: os nomes digitados nas planilhas (por exemplo "INSS", "inss" e "Benefício previdenciário") são reunidos em grupos como Previdenciário, Diferenças salariais, PSS e Imposto de renda; o que não se encaixa vai para "Outros". Confira sempre com a planilha de origem em caso de dúvida.</p>';
    $('corpo').innerHTML = h;
    esconderDica(); document.querySelectorAll('.pr-heat').forEach((el) => ligarDicas(el, el.dataset.indiv === '1'));
    graficoMensal('g1', lista); graficoAnual('g2', lista); graficoAnoAno('g3', lista); graficoGrupos('g4', lista); graficoSemana('g5', lista);
    const rk = $('rank');
    if (rk) { rk.onclick = (ev) => { const th = ev.target.closest('th[data-c]'); if (th) { const c = th.dataset.c; ordem = { col: c, asc: ordem.col === c ? !ordem.asc : c === 'nome' }; rk.innerHTML = tabelaRanking(); return; } const tr = ev.target.closest('tr[data-p]'); if (tr) abrirPessoa(tr.dataset.p); }; }
  }

  if (!window.criarClienteLeitura || !window.SAMP_USUARIO) return;
  carregar().catch((e) => erro(e.message));
})();
</script>
